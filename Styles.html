<style>
/* ───── משתנים ───── */
:root {
  --bg1: #130a2e;
  --bg2: #1d1250;
  --text: #f6f2ff;
  --muted: #cfc6ee;
  --pink: #ff4fc3;
  --purple: #8b5cf6;
  --cyan: #4fe3ff;
  --glass: rgba(255, 255, 255, .09);
  --glass-border: rgba(255, 255, 255, .17);
  --radius: 28px;
  --nav-h: 76px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  font-family: 'Rubik', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  color: var(--text); font-size: 16px; line-height: 1.5;
  background: linear-gradient(160deg, var(--bg1), var(--bg2) 60%, #230f4d);
  background-attachment: fixed;
  overflow-x: hidden;
}
[hidden] { display: none !important; }
a { color: var(--cyan); }
h1, h2, h3 { margin: 0; line-height: 1.2; }

/* ───── רקע: כתמי גרדיאנט ───── */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .45; }
.bg i:nth-child(1) { background: var(--purple); top: -25vmax; right: -20vmax; }
.bg i:nth-child(2) { background: var(--pink); bottom: -28vmax; left: -22vmax; opacity: .32; }
.bg i:nth-child(3) { background: var(--cyan); top: 35%; left: 40%; width: 34vmax; height: 34vmax; opacity: .16; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 90; pointer-events: none; }

/* ───── glass ───── */
.glass {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-radius: var(--radius);
  box-shadow: 0 10px 32px rgba(8, 3, 30, .35);
}

/* ───── מבנה ───── */
.app { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 18px 16px calc(var(--nav-h) + 40px); }
.top { text-align: center; padding: 10px 0 6px; }
.top h1 {
  font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 800;
  background: linear-gradient(90deg, var(--cyan), var(--purple) 45%, var(--pink));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hello { margin: 6px 0 0; color: var(--muted); font-size: 1.1rem; }
.tab { animation: fade .35s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ───── ניווט ───── */
.nav {
  position: fixed; z-index: 50; bottom: 10px; left: 10px; right: 10px;
  height: var(--nav-h); padding: 8px; display: flex; gap: 6px;
  border-radius: 999px; background: rgba(24, 14, 62, .82);
}
.nav-btn {
  flex: 1; min-width: 0; border: 0; border-radius: 999px; cursor: pointer;
  background: transparent; color: var(--muted); font: inherit;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: background .25s, color .25s, transform .2s;
}
.nav-btn b { font-size: .8rem; font-weight: 500; }
.nav-btn svg { width: 24px; height: 24px; }
.nav-btn[aria-selected="true"] { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; box-shadow: 0 0 24px rgba(255, 79, 195, .45); }
.nav-btn:active { transform: scale(.96); }

@media (min-width: 860px) {
  .app { padding-bottom: 40px; }
  .nav { position: sticky; top: 12px; bottom: auto; left: auto; right: auto; max-width: 620px; margin: 14px auto 22px; height: 64px; }
  .nav-btn { flex-direction: row; justify-content: center; gap: 8px; }
  .nav-btn b { font-size: .95rem; }
}

/* ───── שדות וכפתורים ───── */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field label, legend { font-weight: 700; font-size: .95rem; }
input, select, textarea {
  font: inherit; color: var(--text); width: 100%; min-height: 50px; padding: 12px 18px;
  background: rgba(255, 255, 255, .1); border: 1.5px solid rgba(255, 255, 255, .22); border-radius: 20px;
  transition: border-color .2s, box-shadow .2s;
}
textarea { resize: vertical; border-radius: 22px; }
select option { color: #1b1040; }
input::placeholder, textarea::placeholder { color: #b3a8dc; }
input:focus-visible, select:focus-visible, textarea:focus-visible,
.btn:focus-visible, .nav-btn:focus-visible, .pill input:focus-visible + span {
  outline: 3px solid var(--cyan); outline-offset: 2px;
}
input:focus, select:focus, textarea:focus { border-color: var(--cyan); }

.btn {
  font: inherit; font-weight: 700; color: #fff; cursor: pointer; text-decoration: none;
  min-height: 50px; padding: 12px 26px; border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, .28);
  background: rgba(255, 255, 255, .1); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .2s, box-shadow .25s, background .25s;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 0 22px rgba(79, 227, 255, .35); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, var(--purple), var(--pink)); border-color: transparent; }
.btn.primary:hover:not(:disabled) { box-shadow: 0 0 26px rgba(255, 79, 195, .6); }
.btn.danger { background: rgba(255, 80, 110, .22); border-color: rgba(255, 120, 140, .6); }
.btn.small { min-height: 44px; padding: 8px 20px; font-size: .95rem; }
.btn.big { width: 100%; font-size: 1.15rem; min-height: 56px; }
.btn svg { width: 20px; height: 20px; }

/* ───── פילטרים ───── */
.filters { display: flex; flex-wrap: wrap; gap: 12px; padding: 18px 20px 6px; margin-bottom: 8px; }
.filters .field { flex: 1 1 150px; }
.filters .grow { flex: 3 1 240px; }
.count { color: var(--muted); margin: 8px 6px 14px; min-height: 1.5em; }

/* ───── כרטיסים ───── */
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.card {
  padding: 22px; display: flex; flex-direction: column; gap: 10px;
  border-radius: 30px 30px 30px 12px;
  animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 60ms);
  transition: transform .25s, box-shadow .3s, border-color .3s;
}
.card:hover { transform: translateY(-4px); border-color: rgba(255, 79, 195, .55); box-shadow: 0 14px 40px rgba(255, 79, 195, .25), 0 0 0 1px rgba(79, 227, 255, .25); }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }
.card.done { border-color: rgba(79, 227, 255, .45); }
.card-title { font-size: 1.4rem; font-weight: 800; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: .85rem; font-weight: 700; padding: 4px 14px; border-radius: 999px; border: 1.5px solid; white-space: nowrap; }
.chip.canvas { color: #8defff; border-color: rgba(79, 227, 255, .7); background: rgba(79, 227, 255, .13); }
.chip.appscript { color: #ffa4e2; border-color: rgba(255, 79, 195, .7); background: rgba(255, 79, 195, .13); }
.chip.st { color: #fff; border-color: rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .12); }
.chip.grade { color: var(--muted); border-color: rgba(255, 255, 255, .25); }
.kv { margin: 0; }
.kv dt { font-size: .8rem; color: var(--muted); font-weight: 500; }
.kv dd { margin: 0 0 6px; }
.meta { font-size: .95rem; color: var(--muted); border-top: 1px dashed rgba(255, 255, 255, .2); padding-top: 10px; display: grid; gap: 2px; }
.meta b { color: var(--text); }
.credit { padding: 10px 16px; border-radius: 18px; background: linear-gradient(135deg, rgba(139, 92, 246, .35), rgba(255, 79, 195, .3)); font-weight: 700; }
.card-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 6px; }
.note-text { color: var(--muted); font-size: .95rem; }
.manage { border-top: 1px dashed rgba(255, 255, 255, .2); padding-top: 12px; display: grid; gap: 10px; }
.manage .field { margin: 0; }

/* ───── מצב ריק ───── */
.empty { text-align: center; padding: 46px 20px; grid-column: 1 / -1; color: var(--muted); }
.empty svg { width: 110px; height: 110px; margin-bottom: 6px; animation: bob 3.2s ease-in-out infinite; }
.empty h3 { color: var(--text); font-size: 1.4rem; margin-bottom: 4px; }
@keyframes bob { 50% { transform: translateY(-8px); } }

/* ───── טופס חדש ───── */
.privacy {
  display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px; margin-bottom: 18px;
  border-radius: 24px; background: rgba(255, 196, 61, .14); border: 1.5px solid rgba(255, 196, 61, .6);
}
.privacy svg { width: 28px; height: 28px; flex: none; color: #ffd466; }
.privacy p { margin: 2px 0 0; }
.form { padding: 24px; max-width: 720px; margin: 0 auto; }
.form h2 { margin-bottom: 16px; font-size: 1.6rem; }
.size-block { border: 1.5px dashed rgba(255, 255, 255, .3); border-radius: 24px; padding: 16px 18px 18px; margin: 6px 0 20px; }
.size-block legend { padding: 0 10px; font-size: 1.2rem; }
.hint { margin: 0 0 10px; color: var(--muted); font-size: .95rem; }
.q { border: 0; padding: 0; margin: 0 0 14px; }
.q legend { font-size: 1rem; font-weight: 500; padding: 0; margin-bottom: 8px; float: right; width: 100%; }
.q .opts { display: flex; gap: 10px; clear: both; }
.pill { position: relative; flex: 1; max-width: 140px; }
.pill input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.pill span {
  display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px;
  border: 1.5px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .08); font-weight: 700; transition: all .2s;
}
.pill input:checked + span { background: linear-gradient(135deg, var(--purple), var(--pink)); border-color: transparent; box-shadow: 0 0 18px rgba(255, 79, 195, .45); }
.rec { margin-top: 6px; min-height: 28px; font-weight: 700; }
.rec .chip { font-size: 1rem; }

/* ───── ניהול ───── */
.panel { padding: 22px; margin-bottom: 20px; }
.panel h2 { font-size: 1.4rem; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.row .field { margin: 0; flex: 0 1 220px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 50px; font-weight: 500; }
.check input { width: 24px; height: 24px; min-height: 0; accent-color: var(--pink); }
.status-open { font-weight: 800; padding: 6px 16px; border-radius: 999px; }
.status-open.on { background: rgba(80, 230, 150, .2); color: #8cf5bd; }
.status-open.off { background: rgba(255, 120, 140, .2); color: #ffb0bd; }
.section-title { font-size: 1.4rem; margin: 26px 4px 14px; }

/* ───── חלון עריכה ───── */
.modal-back { position: fixed; inset: 0; z-index: 80; background: rgba(8, 3, 30, .7); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 20px 12px; }
.modal { width: 100%; max-width: 560px; padding: 24px; background: rgba(34, 20, 82, .96); }
.modal h2 { margin-bottom: 14px; }
.modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ───── טעינה, טוסט, הודעות ───── */
.loading { position: fixed; inset: 0; z-index: 95; background: rgba(19, 10, 46, .6); display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; font-weight: 700; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.loading[hidden] { display: none !important; }
.spinner { width: 54px; height: 54px; border-radius: 50%; border: 5px solid rgba(255, 255, 255, .2); border-top-color: var(--pink); border-left-color: var(--cyan); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; z-index: 99; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 24px); max-width: min(92vw, 520px); padding: 14px 24px; border-radius: 999px; background: #2b1a66; border: 1.5px solid var(--cyan); font-weight: 700; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); animation: rise .3s both; }
.toast.err { border-color: #ff6b87; background: #4a1530; }
@media (min-width: 860px) { .toast { bottom: 30px; } }
.gate { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
.gate-card { padding: 36px 28px; max-width: 480px; }
.gate-card h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 12px; background: linear-gradient(90deg, var(--cyan), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.gate-card p { font-size: 1.15rem; margin: 0; }

/* ───── גלריה ───── */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.gtop { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding: 16px 22px; margin-bottom: 18px; }
.gstats { display: flex; gap: 10px; flex-wrap: wrap; }
.count-pill { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .95rem; }
.count-pill svg { width: 20px; height: 20px; }
.count-pill.big { padding: 8px 16px; border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, .25); font-weight: 500; color: var(--text); }
.count-pill.on svg { color: var(--pink); }
.pcard { padding: 0 0 20px; overflow: hidden; border-radius: 30px 30px 30px 12px; }
.pcard > *:not(.thumb) { margin-inline: 20px; }
/* גובה קבוע לכל התמונות (בלי קשר ליחס של הצילום) */
.thumb { display: flex; align-items: center; justify-content: center; width: 100%; height: 190px; flex: none; overflow: hidden; border: 0; padding: 0; cursor: pointer; color: rgba(255, 255, 255, .55);
  background: linear-gradient(135deg, rgba(139, 92, 246, .55), rgba(255, 79, 195, .4) 60%, rgba(79, 227, 255, .4)); }
.thumb svg { width: 44px; height: 44px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.proj-shot { display: block; width: 100%; max-height: 380px; object-fit: contain; border-radius: 22px; background: rgba(0, 0, 0, .25); margin-bottom: 10px; }
.preview-box { margin-bottom: 8px; }
.pitch-card { padding: 14px 18px; border-radius: 22px; background: rgba(79, 227, 255, .1); border: 1.5px solid rgba(79, 227, 255, .45); margin: 8px 0; }
.pitch-card h3 { margin-bottom: 6px; }
.pitch-item b { color: var(--cyan); font-size: .9rem; }
.pitch-item p { margin: 0 0 8px; }
.checklist ul { margin: 6px 0 14px; padding-inline-start: 22px; }
.suggestion { padding: 8px 12px; border-radius: 14px; background: rgba(255, 196, 61, .14); border: 1px dashed rgba(255, 196, 61, .6); }
.chip.live { color: #fff; border-color: var(--pink); background: rgba(255, 79, 195, .3); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 16px rgba(255, 79, 195, .7); } }
.presenting { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 20px; margin-bottom: 16px; border-color: var(--pink); box-shadow: 0 0 26px rgba(255, 79, 195, .35); }
.stepper { display: flex; gap: 4px; margin: -2px 0 4px; }
.stepper i { flex: 1; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, .15); }
.stepper i.on { background: linear-gradient(90deg, var(--cyan), var(--pink)); }
.chips .pencil { margin-inline-start: auto; width: 36px; height: 36px; }
.icon-btn.small { width: 36px; height: 36px; vertical-align: middle; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid rgba(255, 255, 255, .12); vertical-align: top; }
thead th { color: var(--muted); font-weight: 700; white-space: nowrap; }
tbody th { font-weight: 700; }
.cell-list { font-size: .8rem; color: var(--muted); max-width: 220px; }
tr.quiet { opacity: .5; }
.timer { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; background: rgba(255, 255, 255, .1); border: 1.5px solid rgba(255, 255, 255, .25); margin-bottom: 10px; }
.timer-disp { font-size: 1.6rem; font-weight: 800; min-width: 3.2ch; text-align: center; font-variant-numeric: tabular-nums; direction: ltr; }
.timer.warn { border-color: #ffd466; } .timer.warn .timer-disp { color: #ffd466; }
.timer.over { border-color: var(--pink); animation: pulse 1s ease-in-out infinite; } .timer.over .timer-disp { color: var(--pink); }
.queue { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: q; }
.queue li { counter-increment: q; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 14px; border-radius: 20px; background: rgba(255, 255, 255, .08); }
.queue li::before { content: counter(q); font-weight: 800; color: var(--cyan); min-width: 1.5ch; }
.queue li.now { border: 1.5px solid var(--pink); background: rgba(255, 79, 195, .15); }
.queue .q-text { flex: 1 1 200px; }
.sum-list { margin: 0 0 8px; padding-inline-start: 22px; }
@media print {
  #app, .bg, #confetti, .nav, .toast, .loading, .no-print, .modal-back:not(:last-of-type) { display: none !important; }
  body { background: #fff !important; }
  .modal-back { position: static; background: none; overflow: visible; padding: 0; display: block; }
  .modal { background: #fff !important; box-shadow: none; border: 0; max-width: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .modal, .modal * { color: #000 !important; -webkit-text-fill-color: #000 !important; }
}
.thumb:focus-visible { outline: 3px solid var(--cyan); outline-offset: -3px; }
.pcard .card-title { margin-top: 12px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-block: 0; }
.pcounts { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.heart-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 6px 16px; border-radius: 999px; cursor: pointer; font: inherit; color: var(--text);
  background: rgba(255, 255, 255, .1); border: 1.5px solid rgba(255, 255, 255, .28); transition: transform .2s, box-shadow .25s; }
.heart-btn svg { width: 20px; height: 20px; }
.heart-btn.on { color: #fff; background: rgba(255, 79, 195, .35); border-color: var(--pink); box-shadow: 0 0 18px rgba(255, 79, 195, .45); }
.heart-btn:hover:not(:disabled) { transform: scale(1.06); }
.heart-btn:disabled { opacity: .6; cursor: not-allowed; }
.linkish { background: none; border: 0; padding: 2px 0; font: inherit; font-weight: 700; color: var(--cyan); cursor: pointer; text-decoration: none; }
.linkish:hover { color: #fff; }
.modal.wide { max-width: 820px; }
.embed { border-radius: 22px; overflow: hidden; border: 1.5px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .06); }
.embed-frame { display: block; width: 100%; height: min(62vh, 520px); min-height: 320px; border: 0; background: #fff; }
.proj-desc { margin: 4px 0 12px; white-space: pre-wrap; }
.comments { display: grid; gap: 10px; margin-bottom: 12px; }
.comment { padding: 10px 16px; border-radius: 20px; background: rgba(255, 255, 255, .08); }
.comment-head { display: flex; gap: 10px; align-items: center; }
.comment-head .icon-btn { margin-inline-start: auto; }
.comment-text { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: rgba(255, 255, 255, .12); color: #fff; }
.icon-btn svg { width: 20px; height: 20px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 12px 0; }
.tile { text-align: center; padding: 14px 8px; border-radius: 22px; background: rgba(255, 255, 255, .09); border: 1px solid var(--glass-border); }
.tile b { display: block; font-size: 1.8rem; background: linear-gradient(90deg, var(--cyan), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tile span { font-size: .85rem; color: var(--muted); }
.paste-zone { margin-top: 8px; padding: 16px; text-align: center; border: 2px dashed rgba(255, 255, 255, .35); border-radius: 20px; color: var(--muted); cursor: pointer; transition: border-color .2s, background .2s; }
.paste-zone:hover, .paste-zone:focus-visible { border-color: var(--cyan); background: rgba(79, 227, 255, .08); outline: none; }
.preview img { max-width: 100%; max-height: 180px; border-radius: 16px; margin-top: 8px; }
input[type="file"] { padding: 10px 14px; }
@media (max-width: 420px) { .nav-btn b { font-size: .68rem; } }

.form-inline { margin-top: 18px; text-align: right; }
.foot { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 36px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
}
</style>
